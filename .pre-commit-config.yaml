repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^web/static/
      - id: end-of-file-fixer
        exclude: ^web/static/
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      # goimports matches CI golangci formatters + local-prefixes (#148). Install: go install golang.org/x/tools/cmd/goimports@latest
      - id: goimports
        name: goimports
        entry: bash -c 'goimports -local "$(go list -m)" -w .'
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test
        entry: go test ./... -race -count=1
        language: system
        pass_filenames: false
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        pass_filenames: false
        types: [go]

      # Prettier runs here rather than through mirrors-prettier: pre-commit's
      # `language: node` hook cannot build its nodeenv on this toolchain
      # ("invalid literal for int() with base 10: '0-alpha'"), so the mirror
      # never installs. `npm test` is prettier --check over the same files.
      - id: npm-test
        name: npm test (prettier --check)
        entry: npm test
        language: system
        pass_filenames: false
        files: \.(js|json|css|html|md|ya?ml)$
